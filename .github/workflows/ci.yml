name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Restore PocketBase binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/asset-calendar/pocketbase/0.40.3/linux-amd64
          key: pb-0.40.3-${{ hashFiles('scripts/pocketbase-checksums.json') }}
      - name: Verify PocketBase binary
        run: |
          node --input-type=module <<'NODE'
          import { ensurePocketBaseBinary } from "./scripts/pocketbase.ts";
          await ensurePocketBaseBinary();
          NODE
      - name: Run non-deployment CI
        run: vp run ci
