name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      - run: vp check
      - run: vp test
      - run: vp build
      - name: Start PocketBase and check health
        run: |
          vp run pocketbase -- --port 18090 >/tmp/pocketbase.log 2>&1 &
          pocketbase_pid=$!
          trap 'kill "$pocketbase_pid"' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:18090/api/health
